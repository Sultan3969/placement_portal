<!DOCTYPE html>
<html>
<head>
    <title>University Placement Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(135deg, #ffecd2, #fcb69f);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            color: #2c3e50;
            font-size: 44px;
            margin-bottom: 50px;
            text-shadow: 1px 2px 5px rgba(0,0,0,0.15);
            z-index: 1;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 16px 36px;
            border-radius: 14px;
            margin: 12px;
            font-size: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            font-weight: 500;
            z-index: 1;
        }

        .btn:hover {
            background: linear-gradient(135deg, #5a67d8, #6b46c1);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .footer {
            position: fixed;
            bottom: 20px;
            text-align: center;
            font-size: 14px;
            color: #7f8c8d;
            width: 100%;
            z-index: 1;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        h1, .btn, .footer {
            animation: fadeIn 1s ease forwards;
        }

        .btn:nth-child(2) {
            animation-delay: 0.2s;
        }

        .btn:nth-child(3) {
            animation-delay: 0.4s;
        }

        .footer {
            animation-delay: 0.6s;
        }

        /* Floating soft circles in background */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            z-index: 0;
            animation: float 10s infinite ease-in-out;
        }

        body::before {
            width: 220px;
            height: 220px;
            top: 8%;
            left: 5%;
        }

        body::after {
            width: 320px;
            height: 320px;
            bottom: 8%;
            right: 5%;
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
            }
            50% {
                transform: translateY(-20px) translateX(10px);
            }
            100% {
                transform: translateY(0) translateX(0);
            }
        }
    </style>
</head>
<body>
    <h1>🎓 University Placement Portal</h1>

    <a class="btn" href="/admin">Admin Login</a>
    <a class="btn" href="/student">Student Login</a>

    <div class="footer">
        © Reva University 2025
    </div>
</body>
</html>
