<!DOCTYPE html>
<html>
<head>
    <title>{{ category }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffecd2, #fcb69f);
            margin: 0;
            padding: 30px;
            color: #333;
        }

        h2 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
            border-radius: 16px;
        }

        ul {
            list-style: none;
            padding: 0;
            max-width: 600px;
            margin: 20px auto;
        }

        li {
            background: #ffffff;
            margin: 15px 0;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        li:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25);
        }

        .company-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        li strong {
            color: #667eea;
            font-weight: 600;
        }

        form {
            margin: 0;
        }

        button {
            border: none;
            background: linear-gradient(135deg, #28a745, #218838);
            color: white;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #218838, #1e7e34);
            transform: translateY(-1px);
        }

        .logout-btn {
            display: block;
            text-align: center;
            margin-top: 30px;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #f857a6, #ff5858);
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 6px 16px rgba(248, 87, 166, 0.4);
            max-width: 200px;
            margin-left: auto;
            margin-right: auto;
        }

        .logout-btn:hover {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(248, 87, 166, 0.6);
        }
    </style>
</head>

<body>
    <h2>{{ category }} Companies</h2>
    <ul>
        {% for company in companies %}
            <li>
                <div class="company-info">
                    <span>{{ company.name }}</span>
                    <strong>{{ company.date }}</strong>
                </div>
                <form method="GET" action="{{ url_for('student_company_details') }}">
                    <input type="hidden" name="company" value="{{ company.name }}">
                    <input type="hidden" name="category" value="{{ category_key }}">
                    <button type="submit">Apply</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <a class="logout-btn" href="/logout">Logout</a>
</body>
</html>
