<!DOCTYPE html>
<html>
<head>
    <title>{{ company }} Requirements</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #f8bbd0);
            margin: 0;
            padding: 30px;
            color: #333;
        }

        .card {
            max-width: 700px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            padding: 30px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #2d3748;
        }

        .success {
            background: #e8f5e9;
            color: #1b5e20;
            border: 1px solid #a5d6a7;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 12px;
            padding: 14px 16px;
        }

        strong {
            color: #4a5568;
        }

        form {
            text-align: center;
            margin-top: 30px;
        }

        button {
            border: none;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #27ae60, #1f8a4c);
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #f857a6, #ff5858);
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>{{ company }} Requirements</h2>

        {% if applied %}
            <div class="success">✅ Application submitted successfully for {{ company }}.</div>
        {% endif %}

        <ul>
            {% for key, value in requirements.items() %}
                <li><strong>{{ key }}:</strong> {{ value }}</li>
            {% endfor %}
        </ul>

        <form method="POST" action="{{ url_for('apply_company') }}">
            <input type="hidden" name="company" value="{{ company }}">
            <input type="hidden" name="category" value="{{ category }}">
            <button type="submit">Apply</button>
        </form>

        <div style="text-align: center;">
            <a class="back-btn" href="{{ url_for('select_category') }}">Back</a>
        </div>
    </div>
</body>
</html>
