<!DOCTYPE html>
<html>
<head>
    <title>Select Category</title>
    <style>
        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f6d365, #fda085);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            animation: bodyFade 1s ease-in-out;
        }

        @keyframes bodyFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .container {
            background: linear-gradient(135deg, #ffffff, #f9f9f9);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 420px;
            width: 90%;
            animation: fadeInUp 1.2s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            color: #333;
            font-size: 26px;
            margin-bottom: 12px;
        }

        h3 {
            color: #666;
            font-size: 20px;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
            color: #ff5e78;
            font-weight: 600;
            font-size: 15px;
            transition: color 0.3s ease;
        }

        a:hover {
            text-decoration: underline;
            color: #ff3366;
        }

        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            margin: 14px 10px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.35s ease;
            box-shadow: 0 6px 18px rgba(102, 126, 234, 0.3);
        }

        button:hover {
            background: linear-gradient(135deg, #5a67d8, #6b46c1);
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 28px rgba(90, 103, 216, 0.4);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 5px 14px rgba(90, 103, 216, 0.3);
        }
    </style>
    <!-- Poppins font for a clean modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <a href="/student">← Back to Login</a>
        <h2>Welcome {{ session['user'] }}</h2>
        <h3>Select Category</h3>
        <form method="POST">
            <button type="submit" name="category" value="technical">Technical</button>
            <button type="submit" name="category" value="non-technical">Non-Technical</button>
        </form>
    </div>
</body>
</html>
